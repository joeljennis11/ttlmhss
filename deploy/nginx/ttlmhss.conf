# TTLMHSS — nginx site (Phase 12C). Supported topology: ONE host, nginx in front, ONE API process.
#
#   browser ──HTTPS──▶ nginx :443 ──▶ /api/*  → API on 127.0.0.1:3000 (HOST=127.0.0.1, TRUST_PROXY=true)
#                                 └─▶ /*      → built web app (apps/web/dist), index.html for app routes
#
# Replace before use (see docs/deployment.md):
#   school.example                   → the school's domain (must match CORS_ORIGINS=https://school.example)
#   /srv/ttlmhss                     → where the repository is checked out
#   /etc/letsencrypt/live/...        → the certificate paths from your certificate tool
# Include this file from the http { } block, e.g. /etc/nginx/sites-enabled/ttlmhss.conf.

# Plain HTTP: only redirects to HTTPS (and lets a certificate tool answer its challenge).
server {
    listen 80;
    listen [::]:80;
    server_name school.example;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx ≥ 1.25.1 prefers `listen 443 ssl;` + `http2 on;` — both forms work.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name school.example;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/school.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ttlmhss_tls:10m;

    root /srv/ttlmhss/apps/web/dist;

    # The API refuses bodies over 1 MB; allow a little headroom for multipart overhead.
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ---- API: forwarded as is. The API sends its own strict headers (CSP default-src 'none',
    # HSTS, nosniff, no-store …), so none are added here.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (never append) so a client cannot inject its own X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;   # large PDF/Excel reports
        proxy_send_timeout 60s;
        proxy_buffering on;
    }

    # ---- Hashed build assets: cache for a year (file names change on every build).
    location /assets/ {
        include /srv/ttlmhss/deploy/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---- Logo, favicons (not hashed): short cache.
    location /brand/ {
        include /srv/ttlmhss/deploy/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # ---- Everything else: a file from the build, or the app (client-side routes such as
    # /attendance). The app shell is never cached so a new release is picked up at once.
    location / {
        include /srv/ttlmhss/deploy/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
