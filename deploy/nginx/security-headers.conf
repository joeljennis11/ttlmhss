# Security headers for the web app (Phase 12C). Included in every web location of ttlmhss.conf
# (nginx drops server-level add_header lines in a location that has its own, so they live here).
# The CSP matches WEB_CSP in apps/web/vite.config.ts plus what a <meta> CSP cannot express
# (frame-ancestors). Exceptions (docs/architecture.md §21): inline style attributes, data:/blob: images.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
